[project]
name = "agent-core"
version = "0.1.0"
description = "Autonomous trading agent for Okane"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "asyncpg>=0.29",
    "redis[hiredis]>=5.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "anthropic>=0.28",
    "openai>=1.35",
    "chromadb>=0.5",
    "optuna>=3.6",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "tenacity>=8.3",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "cryptography>=42.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
